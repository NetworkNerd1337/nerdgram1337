# Weekly dependency updates. GitHub Actions stay pinned to a full commit SHA.
# Dependabot updates that SHA and the version comment on the same line.
# npm updates are grouped so each directory opens one pull request, not one per package.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    groups:
      npm:
        patterns:
          - "*"
