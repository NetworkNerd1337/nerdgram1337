# Publishing a GitHub Release for a vX.Y.Z tag.
# The tag must match the root package.json version. The release title is
# vX.Y.Z Code name from the codenames map. The body is the CHANGELOG section.
# docker-publish.yml pushes ghcr.io/networknerd1337/nerdgram1337:vX.Y.Z
# from this same tag. Keep that image workflow on this version.
# The npm job publishes cli/ as the public package nerdgram1337. The command
# name stays nerdgram. Preferred auth is npm trusted publishing (GitHub OIDC).
# id-token: write is only on that job. Trusted publishing is attempted first.
# If that publish fails and NPM_TOKEN is set, the token is the fallback.
# Delete NPM_TOKEN after a trusted publish succeeds. Provenance is requested
# on both paths.

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Require a stable tag that matches package.json
        run: |
          node scripts/check-version.mjs
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match package.json version v$VERSION"
            exit 1
          fi

      - name: Notes from CHANGELOG
        id: notes
        run: |
          node scripts/changelog-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
          {
            echo "title<<EOF"
            node scripts/changelog-notes.mjs --title "$GITHUB_REF_NAME"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: ${{ steps.notes.outputs.title }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          # The body is the CHANGELOG section only. GitHub's generated
          # "What's Changed" list would be appended after it.
          generate_release_notes: false

  # The CLI version has to match the tag or this job fails. Trusted publishing
  # is preferred and is attempted first, even when NPM_TOKEN is set. The token
  # is only the fallback after OIDC publish fails. id-token: write is only on
  # that job. This job is separate from the GitHub Release.
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Refuse a tag that does not match the CLI version
        run: |
          node scripts/check-version.mjs
          TAG="${GITHUB_REF_NAME}"
          CLI_VERSION="$(node -p "require('./cli/package.json').version")"
          ROOT_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$CLI_VERSION" ] || [ "$CLI_VERSION" != "$ROOT_VERSION" ]; then
            echo "Refusing to publish nerdgram1337. Tag $TAG does not match cli/package.json $CLI_VERSION (root package.json $ROOT_VERSION)."
            exit 1
          fi

      - name: Publish nerdgram1337 to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install -g npm@11.6.2
          npm ci
          cd cli
          # The OIDC attempt must not see an npm token. setup-node writes a
          # project .npmrc when registry-url is set, so that file is removed
          # before the first publish.
          rm -f .npmrc "${GITHUB_WORKSPACE:-}/.npmrc"
          unset NODE_AUTH_TOKEN
          echo "Publishing nerdgram1337 with npm trusted publishing (OIDC)."
          if npm publish --provenance --access public; then
            echo "Published nerdgram1337 with npm trusted publishing (OIDC)."
            exit 0
          fi
          echo "Trusted publishing (OIDC) failed."
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::Trusted publishing failed and NPM_TOKEN is not set."
            exit 1
          fi
          echo "Falling back to NPM_TOKEN."
          export NODE_AUTH_TOKEN="${NPM_TOKEN}"
          printf '%s\n' 'registry=https://registry.npmjs.org' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > .npmrc
          npm publish --provenance --access public
          rm -f .npmrc
          echo "Published nerdgram1337 with NPM_TOKEN."
