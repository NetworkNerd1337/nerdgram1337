name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Check version
        run: node scripts/check-version.mjs

      - name: Check supply-chain pins
        run: node scripts/check-supply-chain.mjs

      - name: Install
        run: |
          npm ci
          npm ci --prefix client
          npm ci --prefix server

      - name: Lockfiles stay clean
        run: |
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            echo "Install changed tracked files:"
            printf '%s\n' "$dirty"
            git diff
            exit 1
          fi

      - name: Lint
        run: npm run lint --prefix client

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Pack the CLI and smoke-test --help
        run: bash scripts/pack-cli-smoke.sh

  docker:
    runs-on: ubuntu-latest
    # amd64 build and smoke, plus an arm64 buildx image and a render inside
    # both. QEMU makes the arm64 half slower than the old amd64-only job.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Check version
        id: ver
        run: |
          node scripts/check-version.mjs
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "codename=$(node scripts/codenames.mjs)" >> "$GITHUB_OUTPUT"

      # Build only. Pull requests and pushes to main do not push to GHCR (push: false).
      - name: Build image
        run: |
          docker build \
            --build-arg NERDGRAM_VERSION="${{ steps.ver.outputs.version }}" \
            --build-arg NERDGRAM_CODENAME="${{ steps.ver.outputs.codename }}" \
            --build-arg NERDGRAM_COMMIT="${{ github.sha }}" \
            -t nerdgram1337:ci .

      - name: Smoke test
        env:
          NERDGRAM_EXPECT_COMMIT: ${{ github.sha }}
        run: bash scripts/docker-smoke.sh nerdgram1337:ci

      - name: Render smoke (linux/amd64)
        run: bash scripts/docker-render-smoke.sh nerdgram1337:ci linux/amd64

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build arm64 image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --load \
            --build-arg NERDGRAM_VERSION="${{ steps.ver.outputs.version }}" \
            --build-arg NERDGRAM_CODENAME="${{ steps.ver.outputs.codename }}" \
            --build-arg NERDGRAM_COMMIT="${{ github.sha }}" \
            -t nerdgram1337:ci-arm64 .

      - name: Render smoke (linux/arm64)
        run: bash scripts/docker-render-smoke.sh nerdgram1337:ci-arm64 linux/arm64
