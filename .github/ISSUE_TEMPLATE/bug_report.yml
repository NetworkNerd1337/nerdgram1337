name: Bug report
description: Something in NerdGram failed or behaved differently than the docs say.
title: "[Bug]: "
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: A short description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, in order.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected versus actual behavior
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NerdGram version
      description: Shown on the About screen.
      placeholder: 1.6.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      description: How you run NerdGram.
      options:
        - Docker
        - npm
        - From source
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and browser
      description: Optional. Include the browser when the problem is in the page.
  - type: textarea
    id: diagram
    attributes:
      label: Diagram snippet
      description: Optional. The smallest diagram that shows the problem.
      render: mermaid
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Optional. Paste a log excerpt or describe the screenshot.
  - type: checkboxes
    id: redacted
    attributes:
      label: Privacy
      options:
        - label: I removed tokens, credentials, and private IPs I don't want public
