name: Feature request
description: A change that would make NerdGram more useful.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem it solves
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: What should NerdGram do instead?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Optional. How will you know the change is done?
  - type: textarea
    id: scope
    attributes:
      label: Out of scope or alternatives considered
      description: Optional. What should this change leave alone?
